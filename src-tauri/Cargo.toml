[package]
name = "mnemora"
version = "0.1.5"
description = "Mnemora desktop application"
authors = ["tushanmiao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mnemora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "4.1.5"
zeroize = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# 仅启用常见 ZIP Deflate 解码，避免把不需要的 Zopfli 编码器打进桌面程序。
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# PDF 工具只在模型明确读取指定页时短暂加载文档，不建立常驻解析缓存。
lopdf = { version = "0.36", default-features = false }
# Office 附件只在工具调用期间解析；DOCX 采用 XML 流式读取，XLSX 使用纯 Rust 读取器。
quick-xml = "0.41"
calamine = "0.36"
tauri-plugin-updater = "2"
