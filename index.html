  <body>
    <!--
      THESIS: Mnemora is a memory index workstation, not a card dashboard; structure shows where work came from and where it continues.
      OWN-WORLD: neutral mineral surfaces, five fixed workspace colors, narrow index rails, crisp rules, compact controls, and spacious reading fields.
      STORY: the user recognizes the active workspace, scans recent local work, resumes it, and always sees a clear next action.
      FIRST VIEWPORT: a 48px activity rail anchors the left; the active workspace fills the remaining shell; Overview opens with a restrained command row above a chronological continuation index.
      FORM: chronological continuation index, selected first in the ordered Plan05 direction, seed 0aec62ed.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root">
      <div class="static-startup" role="status" aria-live="polite">
        <strong>Mnemora</strong>
        <span>正在启动...</span>
      </div>
    </div>
    <style>
      html,body,#root{width:100%;height:100%;margin:0}
      body{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;background:#f7f8f6;color:#252a27}
      .static-startup{display:grid;height:100%;place-content:center;gap:8px;text-align:center}
      .static-startup strong{font-size:18px}.static-startup span{color:#7a827d;font-size:13px}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
